<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NutriPlan & Mandado Semanal · Herramienta para Nutriólogos, Médicos y Pacientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --font-display: "Bricolage Grotesque", -apple-system, system-ui, sans-serif;
  --font-body: "Plus Jakarta Sans", -apple-system, system-ui, sans-serif;

  /* Clinical / Botanical Fresh Palette */
  --bg: #f6f8f5;
  --surface: #ffffff;
  --surface-2: #edf2eb;
  --surface-3: #e1e9de;
  --line: #d8e2d4;
  --line-subtle: #eaf0e7;

  --fg: #13241b;
  --fg-muted: #536b5d;
  --fg-faint: #7a9484;

  --primary: #1e593e;
  --primary-hover: #164630;
  --primary-light: #e6f3eb;
  --primary-border: #9ec9b0;

  --accent: #0284c7;
  --accent-light: #e0f2fe;

  --amber: #d97706;
  --amber-light: #fef3c7;
  --danger: #dc2626;
  --danger-light: #fee2e2;
  --success: #15803d;
  --success-light: #dcfce7;

  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-full: 9999px;

  --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 14px -2px rgba(19, 36, 27, 0.08);
  --shadow-lg: 0 12px 28px -4px rgba(19, 36, 27, 0.12);

  --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1510;
    --surface: #141f18;
    --surface-2: #1b2920;
    --surface-3: #24352b;
    --line: #2b3e33;
    --line-subtle: #1e2d24;

    --fg: #eaf2ec;
    --fg-muted: #95ab9c;
    --fg-faint: #6c8072;

    --primary: #4ade80;
    --primary-hover: #6ee7a0;
    --primary-light: #163321;
    --primary-border: #245738;

    --accent: #38bdf8;
    --accent-light: #082f49;

    --amber: #fbbf24;
    --amber-light: #382405;
    --danger: #f87171;
    --danger-light: #3b1111;
    --success: #4ade80;
    --success-light: #163321;

    --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 14px -2px rgba(0,0,0,0.4);
    --shadow-lg: 0 12px 28px -4px rgba(0,0,0,0.5);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #0d1510;
  --surface: #141f18;
  --surface-2: #1b2920;
  --surface-3: #24352b;
  --line: #2b3e33;
  --line-subtle: #1e2d24;

  --fg: #eaf2ec;
  --fg-muted: #95ab9c;
  --fg-faint: #6c8072;

  --primary: #4ade80;
  --primary-hover: #6ee7a0;
  --primary-light: #163321;
  --primary-border: #245738;

  --accent: #38bdf8;
  --accent-light: #082f49;

  --amber: #fbbf24;
  --amber-light: #382405;
  --danger: #f87171;
  --danger-light: #3b1111;
  --success: #4ade80;
  --success-light: #163321;
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; font-family: var(--font-body); background: var(--bg); color: var(--fg); -webkit-font-smoothing: antialiased; }

body {
  padding-left: max(16px, env(safe-area-inset-left));
  padding-right: max(16px, env(safe-area-inset-right));
  padding-bottom: 80px;
}

button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; transition: var(--transition); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

/* Container */
.container { max-width: 1140px; margin: 0 auto; padding-top: 16px; }

/* Header & Mode Switcher */
header.app-header {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 16px 20px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  margin-bottom: 16px;
}

.brand-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--primary) 0%, #0d9488 100%);
  display: grid;
  place-items: center;
  color: #ffffff;
  box-shadow: 0 4px 10px rgba(30, 89, 62, 0.25);
}
.brand-title {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 20px;
  line-height: 1.1;
  letter-spacing: -0.02em;
}
.brand-subtitle {
  font-size: 12.5px;
  color: var(--fg-muted);
  font-weight: 500;
}

.header-tools {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

/* Mode Switcher Pill */
.mode-toggle {
  display: inline-flex;
  padding: 3px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--radius-full);
}
.mode-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: var(--radius-full);
  font-size: 13px;
  font-weight: 700;
  color: var(--fg-muted);
}
.mode-btn.active {
  background: var(--surface);
  color: var(--fg);
  box-shadow: var(--shadow-sm);
}
.mode-btn.clinician.active {
  color: var(--primary);
}

.theme-toggle, .btn-icon {
  width: 38px;
  height: 38px;
  border-radius: var(--radius-full);
  border: 1px solid var(--line);
  background: var(--surface-2);
  display: grid;
  place-items: center;
  color: var(--fg-muted);
}
.theme-toggle:hover, .btn-icon:hover {
  background: var(--surface-3);
  color: var(--fg);
}

/* Patient / Clinic Banner */
.patient-badge-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 14px;
  background: var(--primary-light);
  border: 1px solid var(--primary-border);
  border-radius: var(--radius-md);
  font-size: 13px;
  color: var(--fg);
  flex-wrap: wrap;
  gap: 8px;
}
.patient-badge-banner .info-pills {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}
.pill-badge {
  background: var(--surface);
  border: 1px solid var(--line);
  padding: 3px 9px;
  border-radius: var(--radius-full);
  font-size: 12px;
  font-weight: 600;
}
.pill-badge.alert-pill {
  background: var(--amber-light);
  color: var(--amber);
  border-color: var(--amber);
}

/* Navigation Tabs */
.nav-tabs {
  display: flex;
  gap: 6px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 6px;
  margin-bottom: 20px;
  overflow-x: auto;
  scrollbar-width: none;
}
.nav-tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 18px;
  border-radius: var(--radius-md);
  font-size: 14px;
  font-weight: 700;
  color: var(--fg-muted);
  white-space: nowrap;
}
.tab-btn:hover {
  color: var(--fg);
  background: var(--surface-2);
}
.tab-btn.active {
  background: var(--primary);
  color: #ffffff;
  box-shadow: 0 2px 8px rgba(30, 89, 62, 0.25);
}
.tab-badge {
  font-size: 11px;
  padding: 1px 7px;
  border-radius: var(--radius-full);
  background: rgba(255,255,255,0.25);
  color: #fff;
}
.tab-btn:not(.active) .tab-badge {
  background: var(--surface-3);
  color: var(--fg-muted);
}

/* KPI Summary Bar */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}
.kpi-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.kpi-label {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--fg-muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.kpi-val {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 26px;
  line-height: 1.15;
  color: var(--fg);
  margin-top: 6px;
  font-variant-numeric: tabular-nums;
}
.kpi-val.highlight { color: var(--primary); }
.kpi-val.warning { color: var(--amber); }
.kpi-val.danger { color: var(--danger); }
.kpi-sub {
  font-size: 12px;
  color: var(--fg-muted);
  margin-top: 4px;
}
.progress-bar-wrap {
  width: 100%;
  height: 6px;
  background: var(--surface-2);
  border-radius: var(--radius-full);
  overflow: hidden;
  margin-top: 8px;
}
.progress-bar-fill {
  height: 100%;
  border-radius: var(--radius-full);
  background: var(--primary);
  transition: width 0.3s ease;
}
.progress-bar-fill.over { background: var(--danger); }

/* Quick Action Buttons */
.action-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 18px;
}
.btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 9px 16px;
  border-radius: var(--radius-full);
  font-size: 13.5px;
  font-weight: 700;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--fg);
  box-shadow: var(--shadow-sm);
}
.btn:hover { background: var(--surface-2); border-color: var(--fg-muted); }
.btn-primary {
  background: var(--primary);
  color: #ffffff;
  border-color: var(--primary);
}
.btn-primary:hover {
  background: var(--primary-hover);
  border-color: var(--primary-hover);
  color: #fff;
}
.btn-whatsapp {
  background: #25D366;
  color: #ffffff;
  border-color: #20ba5a;
}
.btn-whatsapp:hover {
  background: #1eb956;
  color: #fff;
}
.btn-accent {
  background: var(--accent);
  color: #ffffff;
  border-color: var(--accent);
}
.btn-accent:hover { background: #0369a1; color: #fff; }
.btn-sm { padding: 6px 12px; font-size: 12.5px; }

/* Weekly Calendar Grid */
.week-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
  gap: 16px;
}
.day-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 16px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
}
.day-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding-bottom: 10px;
  border-bottom: 1.5px solid var(--line);
  margin-bottom: 10px;
}
.day-name {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.01em;
}
.day-macros {
  font-size: 12px;
  font-weight: 700;
  color: var(--primary);
  background: var(--primary-light);
  padding: 3px 8px;
  border-radius: var(--radius-full);
}

.meal-slot-item {
  padding: 9px 0;
  border-bottom: 1px dashed var(--line);
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 8px;
}
.meal-slot-item:last-child { border-bottom: none; }
.meal-type-label {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--fg-muted);
}
.meal-title-btn {
  text-align: left;
  font-size: 14px;
  font-weight: 700;
  color: var(--fg);
  line-height: 1.3;
  margin-top: 2px;
}
.meal-title-btn:hover { color: var(--primary); text-decoration: underline; }
.meal-meta-pills {
  display: flex;
  gap: 5px;
  margin-top: 4px;
  flex-wrap: wrap;
}
.meta-pill {
  font-size: 11px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 4px;
  background: var(--surface-2);
  color: var(--fg-muted);
}
.meta-pill.p-cost { font-weight: 700; color: var(--success); }
.meal-actions-group {
  display: flex;
  gap: 4px;
}
.btn-swap {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  display: grid;
  place-items: center;
  color: var(--fg-muted);
}
.btn-swap:hover {
  background: var(--primary-light);
  color: var(--primary);
  border-color: var(--primary-border);
}

/* Shopping List View */
.shopping-container {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}
.aisle-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 18px;
  box-shadow: var(--shadow-sm);
}
.aisle-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 12px;
  border-bottom: 1.5px solid var(--line);
  margin-bottom: 12px;
}
.aisle-title-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
}
.aisle-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--primary-light);
  color: var(--primary);
  display: grid;
  place-items: center;
}
.aisle-title {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 800;
}
.aisle-subtotal {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 800;
  color: var(--fg);
}
.grocery-item-row {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  transition: var(--transition);
}
.grocery-item-row:hover { background: var(--surface-2); }
.grocery-item-row.checked { opacity: 0.5; }
.grocery-item-row.checked .g-name { text-decoration: line-through; }
.grocery-item-row input[type="checkbox"] {
  width: 20px;
  height: 20px;
  accent-color: var(--primary);
  cursor: pointer;
}
.g-name { font-size: 14.5px; font-weight: 700; color: var(--fg); }
.g-qty { font-size: 12px; color: var(--fg-muted); }
.g-cost { font-weight: 800; font-size: 14.5px; color: var(--fg); font-variant-numeric: tabular-nums; }

/* Clinical / Doctor View */
.clinical-grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 20px;
}
@media (max-width: 860px) {
  .clinical-grid { grid-template-columns: 1fr; }
}
.card-panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 20px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 16px;
}
.panel-title {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.panel-title svg { color: var(--primary); }

.form-grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.form-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 12px;
}
.form-group label {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--fg-muted);
}
.form-control {
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 600;
  padding: 10px 12px;
  border-radius: var(--radius-md);
  transition: var(--transition);
}
.form-control:focus {
  background: var(--surface);
  border-color: var(--primary);
}

.imc-calculator-box {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 8px;
}
.imc-badge {
  font-weight: 800;
  padding: 4px 12px;
  border-radius: var(--radius-full);
  font-size: 13px;
}

/* Plateau del bien comer visual */
.bien-comer-box {
  background: var(--primary-light);
  border: 1px solid var(--primary-border);
  border-radius: var(--radius-md);
  padding: 16px;
  margin-top: 14px;
}
.bien-comer-bars {
  display: flex;
  height: 16px;
  border-radius: 999px;
  overflow: hidden;
  margin: 10px 0;
}
.bc-ver { background: #22c55e; flex: 50; }
.bc-pro { background: #ef4444; flex: 25; }
.bc-cer { background: #eab308; flex: 25; }
.bc-legend {
  display: flex;
  justify-content: space-between;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--fg-muted);
  flex-wrap: wrap;
  gap: 6px;
}
.bc-legend span::before {
  content: "";
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  margin-right: 5px;
}
.leg-ver::before { background: #22c55e; }
.leg-pro::before { background: #ef4444; }
.leg-cer::before { background: #eab308; }

/* Clinical Presets Checklist */
.checklist-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px dashed var(--line);
  font-size: 13.5px;
}
.checklist-item:last-child { border-bottom: none; }
.checklist-item input {
  margin-top: 3px;
  width: 17px;
  height: 17px;
  accent-color: var(--primary);
}

/* Recipes Catalog View */
.catalog-toolbar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.search-input-wrap {
  flex: 1;
  min-width: 240px;
  position: relative;
}
.search-input-wrap input {
  width: 100%;
  padding-left: 36px;
}
.search-icon-pos {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--fg-muted);
  pointer-events: none;
}
.recipe-cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.recipe-card-single {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  transition: var(--transition);
}
.recipe-card-single:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
  border-color: var(--primary-border);
}
.recipe-card-body {
  padding: 16px;
  display: flex;
  flex-direction: column;
  flex: 1;
  justify-content: space-between;
}
.recipe-card-title {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 800;
  line-height: 1.25;
  margin-bottom: 8px;
}
.recipe-tags {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.tag-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: var(--radius-full);
  background: var(--surface-2);
  color: var(--fg-muted);
}
.tag-badge.clin-dm2 { background: #e0f2fe; color: #0369a1; }
.tag-badge.clin-hta { background: #fef3c7; color: #92400e; }
.tag-badge.clin-deficit { background: #dcfce7; color: #166534; }
.tag-badge.clin-hiper { background: #f3e8ff; color: #6b21a8; }

.recipe-quick-macros {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  background: var(--surface-2);
  padding: 8px;
  border-radius: var(--radius-md);
  text-align: center;
  font-size: 11.5px;
  margin-bottom: 12px;
}
.recipe-quick-macros b { display: block; font-size: 13px; color: var(--fg); }

/* Budget Savings Tips Panel */
.saving-tip-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 5px solid var(--primary);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
}
.saving-tip-title {
  font-weight: 800;
  font-size: 15px;
  margin-bottom: 4px;
  color: var(--fg);
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Modals */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 20, 14, 0.65);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 16px;
}
.modal-box {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  max-width: 620px;
  width: 100%;
  max-height: 88vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  padding: 24px;
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
}
.modal-title {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 800;
}
.close-btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--surface-2);
  display: grid;
  place-items: center;
}

/* Toast */
.toast-msg {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--fg);
  color: var(--surface);
  padding: 12px 24px;
  border-radius: var(--radius-full);
  font-size: 14px;
  font-weight: 700;
  box-shadow: var(--shadow-lg);
  z-index: 200;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Print Stylesheet for Professional Prescription / Meal Plan */
@media print {
  body {
    background: #ffffff !important;
    color: #000000 !important;
    padding: 0 !important;
    font-size: 11pt !important;
  }
  .app-header .header-tools,
  .nav-tabs,
  .action-bar,
  .btn-swap,
  .mode-toggle,
  .theme-toggle,
  .modal-overlay,
  .toast-msg {
    display: none !important;
  }
  .container { max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
  .card-panel, .day-card, .aisle-card {
    border: 1px solid #ccc !important;
    box-shadow: none !important;
    break-inside: avoid;
    margin-bottom: 12pt !important;
  }
  .print-only-header {
    display: block !important;
    border-bottom: 2px solid #1e593e;
    padding-bottom: 10pt;
    margin-bottom: 15pt;
  }
}
.print-only-header { display: none; }

const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const peopleCount = () => STATE.adults + (STATE.hasKids ? STATE.kids : 0);

  .filter(([k]) => STATE.meals[k]).map(([k]) => k);

/* ==========================================================================
   5. CÁLCULOS NUTRICIONALES Y CLÍNICOS
   ========================================================================== */
function calcIMC(weight, height) {
  if (!weight || !height) return { imc: 0, cat: 'No disponible', color: 'var(--fg-muted)' };
  const hM = height / 100;
  const imc = +(weight / (hM * hM)).toFixed(1);
  let cat = 'Normal', color = 'var(--success)';
  if (imc < 18.5) { cat = 'Bajo peso'; color = 'var(--amber)'; }
  else if (imc < 25) { cat = 'Peso Saludable'; color = 'var(--success)'; }
  else if (imc < 30) { cat = 'Sobrepeso'; color = 'var(--amber)'; }
  else if (imc < 35) { cat = 'Obesidad Grado I'; color = 'var(--danger)'; }
  else { cat = 'Obesidad Grado II/III'; color = 'var(--danger)'; }
  return { imc, cat, color };
}

function calcTargetCalories() {
  const goalObj = CLINICAL_GOALS[STATE.patient.goal] || CLINICAL_GOALS.general;
  const base = Math.round(STATE.patient.weight * goalObj.calFactor);
  return Math.max(1200, Math.min(3200, base));
}

function calcWaterLiters() {
  return +(STATE.patient.weight * 0.035).toFixed(1); // 35ml por kg de peso
}

/* ==========================================================================
   6. MOTOR DE PLANEACIÓN DEL MENÚ Y PRESUPUESTO
   ========================================================================== */
function recipeFlags(r) {
  let f = '';
  for (const k in r.i) {
    if (I[k]) f += I[k][5] || '';
  }
  return f;
}

function isRecipeAllowed(r, slot) {
  const f = recipeFlags(r);
  if (STATE.diet === 'veg' && /[mf]/.test(f)) return false;
  if (STATE.diet === 'vegan' && /[mfdeh]/.test(f)) return false;
  if (STATE.diet === 'pesc' && /m/.test(f)) return false;
  if (STATE.lowcarb && (slot === 'alm' || slot === 'cen') && /c/.test(f)) return false;
  for (const k in r.i) {
    if (STATE.excl.includes(k)) return false;
  }
  return true;
}

function getSlotType(slot) {
  if (slot === 'sm' || slot === 'st') return STATE.snack[slot] === 'dulce' ? 'sd' : 'ss';
  return slot;
}

function getCandidates(slot) {
  const type = getSlotType(slot);
  return R.filter(r => r.s.includes(type) && isRecipeAllowed(r, slot));
}

function unitCost(r) {
  let c = 0;
  for (const k in r.i) {
    const item = I[k];
    if (item) c += (r.i[k] * item[4]) / item[3];
  }
  return c;
}

function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function buildWeeklyPlan() {
  const rand = rng(STATE.seed);
  const slots = activeSlots();
  const used = {};
  const plan = [];
  const targetPerMeal = STATE.budget / Math.max(1, servings()) / (7 * Math.max(1, slots.length));

  for (let d = 0; d < 7; d++) {
    const day = {};
    for (const slot of slots) {
      const pool = getCandidates(slot);
      if (!pool.length) { day[slot] = null; continue; }

      let best = null;
      let maxScore = -1e9;
      for (const r of pool) {
        const u = used[r.id] || 0;
        const prev = d > 0 && plan[d - 1][slot] === r.id;
        const costDiff = unitCost(r) - targetPerMeal;

        // Bonificación clínica si empata con la meta del paciente
        const clinBonus = (r.clin && r.clin.includes(STATE.patient.goal)) ? 1.5 : 0;

        let score = rand() * 1.5 + clinBonus - (u * 2.2) - (prev ? 4 : 0) - (Object.values(day).includes(r.id) ? 6 : 0);
        if (costDiff > 0) score -= (costDiff / 10);

        if (score > maxScore) {
          maxScore = score;
          best = r;
        }
      }
      day[slot] = best ? best.id : pool[0].id;
      if (best) used[best.id] = (used[best.id] || 0) + 1;
    }
    plan.push(day);
  }

  // Ajuste inteligente hacia el presupuesto si se pasa
  for (let it = 0; it < 60 && calculateGroceries(plan).total > STATE.budget; it++) {
    let mostExpensive = null;
    let highestCost = 0;
    plan.forEach((day, d) => {
      for (const s in day) {
        if (day[s] == null) continue;
        const c = unitCost(R[day[s]]);
        if (c > highestCost && getCandidates(s).some(r => unitCost(r) < c * 0.85)) {
          highestCost = c;
          mostExpensive = [d, s];
        }
      }
    });
    if (!mostExpensive) break;
    const [d, s] = mostExpensive;
    const cur = R[plan[d][s]];
    const cheaper = getCandidates(s)
      .filter(r => unitCost(r) < unitCost(cur) * 0.85)
      .sort((a, b) => unitCost(a) - unitCost(b));
    if (cheaper.length) plan[d][s] = cheaper[0].id;
  }

  return plan;
}

function calculateGroceries(plan) {
  const need = {};
  const sv = servings();
  plan.forEach(day => {
    for (const s in day) {
      const id = day[s];
      if (id == null) continue;
      const r = R[id];
      for (const k in r.i) {
        need[k] = (need[k] || 0) + (r.i[k] * sv);
      }
    }
  });

  const items = [];
  let total = 0;

  for (const k in need) {
    if (!I[k]) continue;
    const [name, aisle, unit, packQty, packPrice, , bulkStep] = I[k];
    const qty = need[k];
    let buy, cost, label;

    if (bulkStep) {
      buy = Math.max(bulkStep, Math.ceil(qty / bulkStep - 1e-9) * bulkStep);
      cost = (buy / packQty) * packPrice;
      label = formatQty(buy, unit);
    } else {
      const packs = Math.max(1, Math.ceil(qty / packQty - 1e-9));
      cost = packs * packPrice;
      label = packQty === 1 ? `${packs} pz` : `${packs} paq (${formatQty(packQty, unit)})`;
    }

    total += cost;
    items.push({
      key: k,
      name,
      aisle,
      label,
      cost,
      need: qty,
      unit
    });
  }

  return { items, total };
}

function formatQty(q, u) {
  if (u === 'g') return q >= 1000 ? `${+(q / 1000).toFixed(2)} kg` : `${Math.round(q)} g`;
  if (u === 'ml') return q >= 1000 ? `${+(q / 1000).toFixed(2)} L` : `${Math.round(q)} ml`;
  return `${+q.toFixed(1)} pz`;
}

function formatNeed(q, u) {
  if (u === 'pz') return q < 1 ? '½ pz aprox.' : `${Math.round(q * 2) / 2} pz`;
  return formatQty(Math.round(q / 5) * 5 || Math.round(q), u);
}

function renderMenuView(plan, slots) {
  let h = `<div class="week-grid">`;
  plan.forEach((day, d) => {
    let dayKc = 0, dayPr = 0;
    for (const s in day) {
      if (day[s] != null) {
        dayKc += R[day[s]].kc;
        dayPr += R[day[s]].pr;
      }
    }
    h += `
    <div class="day-card">
      <div class="day-header">
        <div class="day-name">${DAYS[d]}</div>
        <div class="day-macros">${dayKc} kcal · ${dayPr}g P</div>
      </div>
      <div class="meals-list">
    `;

    slots.forEach(slot => {
      const recId = day[slot];
      const r = recId != null ? R[recId] : null;
      h += `
      <div class="meal-slot-item">
        <div>
          <div class="meal-type-label">${SLOT_NAMES[slot]}</div>
          ${r ? `
            <button class="meal-title-btn" data-open-rec="${r.id}">${esc(r.n)}</button>
            <div class="meal-meta-pills">
              <span class="meta-pill">${r.kc} kcal</span>
              <span class="meta-pill">${r.pr}g proteína</span>
              <span class="meta-pill p-cost">≈ ${money(unitCost(r) * servings())}</span>
              ${r.time ? `<span class="meta-pill">⏱️ ${r.time}</span>` : ''}
            </div>
          ` : `<span style="font-size:13px;color:var(--fg-muted)">Sin receta compatible; revisa tus ajustes</span>`}
        </div>
        <div class="meal-actions-group">
          ${r ? `
            <button class="btn-swap" data-swap-slot="${d}|${slot}" title="Cambiar por otra receta">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 9h13l-4-4M20 15H7l4 4"/></svg>
            </button>
          ` : ''}
        </div>
      </div>
      `;
    });

    h += `</div></div>`;
  });
  h += `</div>`;
  return h;
}

function renderShoppingView(items) {
  const groups = {};
  items.forEach(it => {
    groups[it.aisle] = groups[it.aisle] || [];
    groups[it.aisle].push(it);
  });

  const gotCount = items.filter(it => STATE.got[it.key]).length;

  let h = `
  <div class="card-panel" style="margin-bottom:16px;">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <div>
        <div style="font-size:18px; font-weight:800; font-family:var(--font-display);">Lista Organizada para el Supermercado</div>
        <div style="font-size:13px; color:var(--fg-muted);">
          <b>${gotCount} de ${items.length} productos en el carrito</b> · Cantidades optimizadas para ${peopleCount()} personas
        </div>
      </div>
      <div class="btn-group">
        <button class="btn btn-sm" id="btn-copy-list">Copiar Lista de Texto</button>
        <button class="btn btn-sm" id="btn-clear-checks">Desmarcar Todos</button>
      </div>
    </div>
  </div>

  <div class="shopping-container">
  `;

  for (const a in AISLES) {
    if (!groups[a] || !groups[a].length) continue;
    const aisleGroup = groups[a].sort((x, y) => x.name.localeCompare(y.name));
    const aisleSubtotal = aisleGroup.reduce((s, it) => s + it.cost, 0);

    h += `
    <div class="aisle-card">
      <div class="aisle-header">
        <div class="aisle-title-wrap">
          <div class="aisle-icon">${AISLES[a].icon}</div>
          <div class="aisle-title">${AISLES[a].name}</div>
        </div>
        <div class="aisle-subtotal">${money(aisleSubtotal)}</div>
      </div>

      <div class="grocery-items-list">
        ${aisleGroup.map(it => {
          const isGot = !!STATE.got[it.key];
          return `
          <label class="grocery-item-row ${isGot ? 'checked' : ''}">
            <input type="checkbox" data-check-item="${it.key}" ${isGot ? 'checked' : ''}>
            <div>
              <div class="g-name">${esc(it.name)}</div>
              <div class="g-qty">Comprar: <b>${it.label}</b> · receta pide ${formatNeed(it.need, it.unit)}</div>
            </div>
            <div class="g-cost">${money(it.cost)}</div>
          </label>
          `;
        }).join('')}
      </div>
    </div>
    `;
  }

  h += `</div>`;
  return h;
}

  root.innerHTML = `

    <div class="modal-box">

        <div>

          <div class="modal-title" style="margin-top:4px;">Alternativas según tus preferencias</div>

      <div style="max-height:60vh; overflow-y:auto; display:flex; flex-direction:column; gap:8px;">

            <div>
              <div style="font-weight:700; font-size:14.5px;">${esc(r.n)}</div>
              <div style="font-size:12px; color:var(--fg-muted); margin-top:2px;">
                ${r.kc} kcal · ${r.pr}g Prot · ≈ ${money(unitCost(r) * servings())} por comida
              </div>
            </div>
            <div>
              ${isCur ? `
                <span class="pill-badge" style="background:var(--primary); color:#fff;">Actual</span>
              ` : `
                <button class="btn btn-sm btn-primary" data-select-swap="${r.id}">Elegir</button>
              `}
            </div>
          </div>
          `;
        }).join('')}
      </div>
    </div>
  </div>
  `;

  const close = () => { root.innerHTML = ''; };
  $('#modal-close').onclick = close;
  $('#modal-overlay').onclick = e => { if (e.target.id === 'modal-overlay') close(); };

  $$('[data-select-swap]').forEach(btn => {

      const newId = +btn.dataset.selectSwap;
      STATE.plan[dayIdx][slotKey] = newId;
      saveState();
      close();
      renderApp();
      showToast(`Platillo cambiado por: ${R[newId].n}`);

function showToast(msg) {
  const root = $('#toast-root');
  const d = document.createElement('div');
  d.className = 'toast-msg';
  d.innerHTML = `<span>✓</span><span>${esc(msg)}</span>`;
  root.appendChild(d);
  setTimeout(() => d.remove(), 2600);
}

/* ==========================================================================
   10. VINCULACIÓN DE EVENTOS (EVENT LISTENERS)

function bindEventListeners(items) {
  // Cambio de pestaña
  $$('[data-tab]').forEach(btn => {
    btn.onclick = () => {
      STATE.tab = btn.dataset.tab;
      saveState();
      renderApp();
      window.scrollTo(0, 0);
    };
  });

  // Switch de Modo (Nutriólogo / Paciente)
  if ($('#btn-mode-patient')) {
    $('#btn-mode-patient').onclick = () => {
      STATE.mode = 'patient';
      saveState();
      renderApp();
      showToast('Cambiado a Modo Paciente');
    };
  }
  if ($('#btn-mode-clinician')) {
    $('#btn-mode-clinician').onclick = () => {
      STATE.mode = 'clinician';
      STATE.tab = 'clinical';
      saveState();
      renderApp();
      showToast('Cambiado a Modo Nutriólogo / Médico');
    };
  }

  // Toggle Tema Oscuro/Claro
  if ($('#btn-theme-toggle')) {
    $('#btn-theme-toggle').onclick = () => {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme_pref', next);
    };
  }

  // Regenerar menú
  if ($('#btn-regen-menu')) {
    $('#btn-regen-menu').onclick = () => {
      STATE.seed = (STATE.seed * 48271 + 11) % 2147483647;
      STATE.plan = buildWeeklyPlan();
      saveState();
      renderApp();
      showToast('Nuevo menú semanal generado con éxito');
    };
  }

  // Imprimir / PDF
  if ($('#btn-print-plan')) {
    $('#btn-print-plan').onclick = () => {
      window.print();
    };
  }

  // Compartir por WhatsApp
  if ($('#btn-share-whatsapp')) {
    $('#btn-share-whatsapp').onclick = () => {
      const slots = activeSlots();
      let text = `🥦 *PLAN NUTRICIONAL SEMANAL Y MANDADO*\n`;
      text += `👤 *Paciente:* ${STATE.patient.name} (${STATE.patient.weight} kg)\n`;
      text += `🩺 *Especialista:* ${STATE.clinician.name} (${STATE.clinician.license})\n`;
      text += `🎯 *Objetivo:* ${CLINICAL_GOALS[STATE.patient.goal].name}\n\n`;

      text += `📅 *MENÚ DE LA SEMANA*\n`;
      STATE.plan.forEach((day, d) => {
        text += `\n*${DAYS[d]}:*\n`;
        slots.forEach(s => {
          const recId = day[s];
          if (recId != null) {
            text += `• ${SLOT_NAMES[s]}: ${R[recId].n} (${R[recId].kc} kcal)\n`;
          }
        });
      });

      text += `\n🛒 *LISTA RESUMIDA DEL MANDADO*\n`;
      text += `Presupuesto estimado: ${money(calculateGroceries(STATE.plan).total)}\n`;
      items.slice(0, 15).forEach(it => {
        text += `• ${it.name}: ${it.label}\n`;
      });
      if (items.length > 15) {
        text += `... y ${items.length - 15} productos más.\n`;
      }

      text += `\n💧 *Meta de agua diaria:* ${calcWaterLiters()} L\n`;
      text += `¡Mucho éxito con tu alimentación saludable! 🌱`;

      const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
      window.open(url, '_blank');
    };
  }

  // Modal de Receta
  $$('[data-open-rec]').forEach(btn => {
    btn.onclick = () => openRecipeModal(+btn.dataset.openRec);
  });

  // Modal de Swap
  $$('[data-swap-slot]').forEach(btn => {
    btn.onclick = () => {
      const [d, s] = btn.dataset.swapSlot.split('|');
      openSwapModal(+d, s);
    };
  });

  // Checkbox de la lista del mandado
  $$('[data-check-item]').forEach(cb => {
    cb.onchange = () => {
      STATE.got[cb.dataset.checkItem] = cb.checked;
      saveState();
      // Solo actualizamos clases visuales para no re-renderizar todo
      cb.closest('.grocery-item-row').classList.toggle('checked', cb.checked);
    };
  });

  // Copiar lista
  if ($('#btn-copy-list')) {
    $('#btn-copy-list').onclick = () => {
      let txt = `LISTA DEL MANDADO SEMANAL (${money(calculateGroceries(STATE.plan).total)})\n\n`;
      items.forEach(it => {
        txt += `- [ ] ${it.name}: ${it.label} (${money(it.cost)})\n`;
      });
      navigator.clipboard.writeText(txt).then(() => {
        showToast('Lista copiada al portapapeles');
      });
    };
  }

  // Desmarcar todo
  if ($('#btn-clear-checks')) {
    $('#btn-clear-checks').onclick = () => {
      STATE.got = {};
      saveState();
      renderApp();
      showToast('Lista desmarcada');
    };
  }

  // Slider de Presupuesto
  if ($('#budget-slider')) {
    $('#budget-slider').oninput = e => {
      STATE.budget = +e.target.value;
      STATE.plan = buildWeeklyPlan();
      saveState();
      renderApp();
    };
  }

  // Buscador y filtros de recetas
  if ($('#recipe-search-input')) {
    const filterRecipes = () => {
      const query = ($('#recipe-search-input').value || '').toLowerCase().trim();
      const slotFilter = $('#recipe-slot-filter').value;
      const clinFilter = $('#recipe-clin-filter').value;

      const filtered = R.filter(r => {
        const matchesQuery = !query || r.n.toLowerCase().includes(query) || Object.keys(r.i).some(k => I[k] && I[k][0].toLowerCase().includes(query));
        const matchesSlot = slotFilter === 'all' || (slotFilter === 'snack' ? (r.s.includes('sm') || r.s.includes('st') || r.s.includes('sd') || r.s.includes('ss')) : r.s.includes(slotFilter));
        const matchesClin = clinFilter === 'all' || (r.clin && r.clin.includes(clinFilter));
        return matchesQuery && matchesSlot && matchesClin;
      });

      $('#recipe-cards-container').innerHTML = renderRecipeCardList(filtered);
      // Re-vincular botones de recetas
      $$('#recipe-cards-container [data-open-rec]').forEach(b => {
        b.onclick = () => openRecipeModal(+b.dataset.openRec);
      });
    };

    $('#recipe-search-input').oninput = filterRecipes;
    $('#recipe-slot-filter').onchange = filterRecipes;
    $('#recipe-clin-filter').onchange = filterRecipes;
  }

  // Guardar Cambios Clínicos
  if ($('#btn-save-clinical')) {
    $('#btn-save-clinical').onclick = () => {
      STATE.patient.name = $('#p-name').value;
      STATE.patient.age = +$('#p-age').value;
      STATE.patient.weight = +$('#p-weight').value;
      STATE.patient.height = +$('#p-height').value;
      STATE.patient.goal = $('#p-goal').value;

      STATE.clinician.name = $('#c-name').value;
      STATE.clinician.license = $('#c-license').value;
      STATE.clinician.clinic = $('#c-clinic').value;
      STATE.clinician.phone = $('#c-phone').value;
      STATE.clinician.notes = $('#c-notes').value;

      // Pautas activas
      STATE.activeTips = [];
      $$('[data-tip-id]').forEach(cb => {
        if (cb.checked) STATE.activeTips.push(cb.dataset.tipId);
      });

      STATE.plan = buildWeeklyPlan();
      saveState();
      renderApp();
      showToast('Datos clínicos y metas actualizadas');
    };
  }

  // Ajustes de Comensales
  if ($('#btn-adult-minus')) {
    $('#btn-adult-minus').onclick = () => {
      STATE.adults = Math.max(1, STATE.adults - 1);
      saveState();
      renderApp();
    };
    $('#btn-adult-plus').onclick = () => {
      STATE.adults = Math.min(10, STATE.adults + 1);
      saveState();
      renderApp();
    };
  }
  if ($('#btn-kid-minus')) {
    $('#btn-kid-minus').onclick = () => {
      STATE.kids = Math.max(0, STATE.kids - 1);
      STATE.hasKids = STATE.kids > 0;
      saveState();
      renderApp();
    };
    $('#btn-kid-plus').onclick = () => {
      STATE.kids = Math.min(8, STATE.kids + 1);
      STATE.hasKids = true;
      saveState();
      renderApp();
    };
  }

  // Tiempos de comida en Config
  $$('[data-toggle-meal]').forEach(btn => {
    btn.onclick = () => {
      const k = btn.dataset.toggleMeal;
      STATE.meals[k] = !STATE.meals[k];
      STATE.plan = buildWeeklyPlan();
      saveState();
      renderApp();
    };
  });

  // Dieta en Config
  $$('[data-set-diet]').forEach(btn => {
    btn.onclick = () => {
      STATE.diet = btn.dataset.setDiet;
      STATE.plan = buildWeeklyPlan();
      saveState();
      renderApp();
    };
  });

  if ($('#btn-toggle-lowcarb')) {
    $('#btn-toggle-lowcarb').onclick = () => {
      STATE.lowcarb = !STATE.lowcarb;
      STATE.plan = buildWeeklyPlan();
      saveState();
      renderApp();
    };
  }

  // Agregar / Quitar exclusiones
  if ($('#btn-add-excl')) {
    $('#btn-add-excl').onclick = () => {
      const val = $('#select-add-excl').value;
      if (val && !STATE.excl.includes(val)) {
        STATE.excl.push(val);
        STATE.plan = buildWeeklyPlan();
        saveState();
        renderApp();
        showToast(`Ingrediente ${I[val][0]} excluido`);
      }
    };
  }

  $$('[data-remove-excl]').forEach(btn => {
    btn.onclick = () => {
      const k = btn.dataset.removeExcl;
      STATE.excl = STATE.excl.filter(x => x !== k);
      STATE.plan = buildWeeklyPlan();
      saveState();
      renderApp();
    };
  });

  if ($('#btn-save-config')) {
    $('#btn-save-config').onclick = () => {
      STATE.plan = buildWeeklyPlan();
      saveState();
      renderApp();
      showToast('Configuración guardada y menú regenerado');
    };
  }

  if ($('#btn-reset-default')) {
    $('#btn-reset-default').onclick = () => {
      if (confirm('¿Deseas restablecer las configuraciones iniciales?')) {
        STATE = structuredClone(DEFAULT_STATE);
        saveState();
        renderApp();
        showToast('Valores restablecidos');
      }
    };
  }
}

function effectivePrice(k){return Number.isFinite(+STATE.prices[k])&&+STATE.prices[k]>=0?+STATE.prices[k]:I[k][4];}
unitCost=function(r){return Object.entries(r.i).reduce((s,[k,q])=>s+(I[k]?q*effectivePrice(k)/I[k][3]:0),0);};
calcTargetCalories=function(){return +STATE.targets.kcal||0;};
calcWaterLiters=function(){return +STATE.targets.water||0;};
const oldAllowed=isRecipeAllowed;
isRecipeAllowed=function(r,s){return oldAllowed(r,s)&&(!STATE.maxTime||parseInt(r.time)<=STATE.maxTime)&&(!STATE.maxCost||unitCost(r)<=STATE.maxCost);};
calculateGroceries=function(plan){
 const need={};for(const day of plan||[])for(const id of Object.values(day)){if(id==null||!R[id])continue;for(const [k,q]of Object.entries(R[id].i))need[k]=(need[k]||0)+q*servings();}
 let total=0,consumed=0,withoutPantry=0;const items=[];
 for(const[k,qty]of Object.entries(need)){
  if(!I[k])continue;const[name,aisle,unit,packQty,,,step]=I[k],price=effectivePrice(k),have=Math.max(0,+STATE.pantry[k]||0),missing=Math.max(0,qty-have);
  const rounding=step||packQty,buy=Math.ceil(Math.max(0,missing-1e-9)/rounding)*rounding,full=Math.ceil((qty-1e-9)/rounding)*rounding,cost=buy/packQty*price;
  const label=buy===0?'Ya está en tu despensa':step?formatQty(buy,unit):`${buy/packQty} ${packQty===1?'pz':'paq'}${packQty===1?'':` (${formatQty(packQty,unit)})`}`;
  total+=cost;consumed+=qty/packQty*price;withoutPantry+=full/packQty*price;
  items.push({key:k,name,aisle,label,cost,need:qty,unit,buy,have,missing,leftover:Math.max(0,have+buy-qty)});
 }
 return{items,total,consumed,withoutPantry,saved:withoutPantry-total};
};
// Variedad sin sustituir por una misma receta durante el ajuste económico.
buildWeeklyPlan=function(){
 const rand=rng(STATE.seed),slots=activeSlots(),used={},plan=[];
 for(let d=0;d<7;d++){
  const day={};for(const slot of slots){
   const pool=getCandidates(slot);if(!pool.length){day[slot]=null;continue;}
   const target=STATE.budget/Math.max(1,servings())/(7*Math.max(1,slots.length));
   const ranked=pool.map(r=>({r,score:rand()*2-(used[r.id]||0)*5-(Object.values(day).includes(r.id)?8:0)-(d&&plan[d-1][slot]===r.id?5:0)-Math.max(0,unitCost(r)-target)/15+(STATE.favorites.includes(r.id)?1:0)})).sort((a,b)=>b.score-a.score);
   day[slot]=ranked[0].r.id;used[day[slot]]=(used[day[slot]]||0)+1;
  }plan.push(day);
 }
 // Buscar sustituciones solo si reducen la compra real, respetando la variedad.
 for(let round=0;round<16;round++){
  const total=calculateGroceries(plan).total;if(total<=STATE.budget)break;
  let best=null,gain=0;for(let d=0;d<7;d++)for(const s of slots){const old=plan[d][s];if(old==null)continue;
   const candidates=getCandidates(s).filter(r=>r.id!==old&&(used[r.id]||0)<2&&!Object.values(plan[d]).includes(r.id)).sort((a,b)=>unitCost(a)-unitCost(b)).slice(0,4);
   for(const r of candidates){plan[d][s]=r.id;const diff=total-calculateGroceries(plan).total;if(diff>gain+0.01){gain=diff;best={d,s,old,id:r.id};}}plan[d][s]=old;
  }if(!best)break;plan[best.d][best.s]=best.id;used[best.old]--;used[best.id]=(used[best.id]||0)+1;
 }return plan;
};

renderConfigView=function(){return `<div class="card-panel np-data-panel"><h2 class="panel-title">Tu archivo de trabajo</h2><p class="np-muted">Los datos se guardan en este navegador. Puedes descargar un respaldo para continuar en otro equipo. Incluye los datos que captures; compártelo solo con quien corresponda. Los modos cambian la vista, no son cuentas con permisos.</p><div class="btn-group"><button class="btn" id="np-export">Descargar respaldo JSON</button><label class="btn" for="np-import">Cargar respaldo<input hidden id="np-import" type="file" accept=".json,application/json"></label></div><p class="np-muted" id="np-import-message" role="status"></p></div>`+originalConfig()+`<form id="np-limits-form" class="card-panel" style="max-width:760px;margin:18px auto"><h2 class="panel-title">Haz que el menú se adapte a tu rutina</h2><div class="form-grid-2">${field('np-max-time','Máximo de minutos por receta · 0 sin límite',STATE.maxTime,'number','required min="0" max="600"')}${field('np-max-cost','Máximo MXN por porción · 0 sin límite',STATE.maxCost,'number','required min="0" max="10000" step="0.01"')}</div><p class="np-muted">Si las exclusiones o límites no dejan recetas disponibles, el tiempo quedará vacío. Las porciones infantiles del ajuste familiar son solo una estimación de compra y requieren individualización profesional.</p><button class="btn btn-primary" type="submit">Aplicar y proponer menú</button></form>`;};
function exportBackup(){const blob=new Blob([JSON.stringify({app:'NutriPlan',version:3,state:STATE},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='NutriPlan_respaldo.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function validateBackup(data){
 if(data?.app!=='NutriPlan'||data.version!==3||!data.state||typeof data.state!=='object')throw Error('Este archivo no es un respaldo NutriPlan compatible.');
 const s=data.state;if(!s.patient||!s.clinician||!Array.isArray(s.customRecipes)||!Array.isArray(s.excl)||!s.meals||!s.snack||!s.targets)throw Error('El respaldo está incompleto.');
 const finite=(v,min,max)=>typeof v==='number'&&Number.isFinite(v)&&v>=min&&v<=max;
 if(!finite(s.budget,1,1e6)||!finite(s.adults,1,10)||!finite(s.kids,0,8)||!finite(s.patient.age,1,120)||!finite(s.patient.weight,1,500)||!finite(s.patient.height,30,250)||!['patient','clinician'].includes(s.mode)||!['menu','list','budget','recipes','clinical','config'].includes(s.tab)||!['none','veg','vegan','pesc'].includes(s.diet))throw Error('Revisa los valores de perfil o presupuesto.');
 if(!finite(s.targets.kcal,0,10000)||!finite(s.targets.water,0,20))throw Error('Metas fuera de rango.');
 for(const r of s.customRecipes){if(!r||typeof r.n!=='string'||typeof r.p!=='string'||!Array.isArray(r.s)||!r.s.length||!r.s.every(x=>['des','alm','cen','sd','ss'].includes(x))||typeof r.time!=='string'||!r.i||!Object.keys(r.i).length||Object.entries(r.i).some(([k,v])=>!I[k]||!finite(v,0,10000))||['kc','pr','ch','gr','fib'].some(k=>!finite(r[k],0,10000)))throw Error('Una receta contiene datos inválidos.');}
 if(!Array.isArray(s.favorites)||!Array.isArray(s.activeTips)||s.excl.some(k=>!I[k]))throw Error('Preferencias inválidas.');
 for(const m of ['pantry','prices'])if(!s[m]||Object.entries(s[m]).some(([k,v])=>!I[k]||!finite(v,0,1e6)))throw Error('Despensa o precios inválidos.');
 const max=BASE_RECIPE_COUNT+s.customRecipes.length;if(s.plan&&(!Array.isArray(s.plan)||s.plan.length!==7||s.plan.some(d=>!d||typeof d!=='object'||Object.entries(d).some(([k,v])=>!['des','alm','cen','sm','st'].includes(k)||(v!==null&&(!Number.isInteger(v)||v<0||v>=max))))))throw Error('Menú inválido.');
 return s;
}

 if($('#np-pantry-form'))$('#np-pantry-form').onsubmit=e=>{e.preventDefault();$('[data-pantry]').forEach(x=>STATE.pantry[x.dataset.pantry]=+x.value);$('[data-price]').forEach(x=>STATE.prices[x.dataset.price]=+x.value);STATE.got={};rerender();showToast('Lista recalculada con tu despensa');};
 if($('#np-clinical-form'))$('#np-clinical-form').onsubmit=e=>{e.preventDefault();STATE.patient={...STATE.patient,name:$('#p-name').value,age:+$('#p-age').value,weight:+$('#p-weight').value,height:+$('#p-height').value,goal:$('#p-goal').value};for(const[k,id]of Object.entries({name:'c-name',license:'c-license',clinic:'c-clinic',phone:'c-phone',notes:'c-notes',specialty:'np-specialty'}))STATE.clinician[k]=$('#'+id).value;STATE.targets={kcal:+$('#np-kcal').value||0,water:+$('#np-water').value||0};STATE.restrictions=$('#np-restrictions').value;STATE.followup=$('#np-followup').value;STATE.activeTips=Array.from($('[data-tip-id]:checked')).map(x=>x.dataset.tipId);STATE.reviewed=false;rerender();showToast('Ficha guardada; menú conservado');};
 if($('#np-review'))$('#np-review').onclick=()=>{STATE.reviewed=true;STATE.reviewedAt=new Date().toLocaleDateString('es-MX');rerender();};
 if($('#np-limits-form'))$('#np-limits-form').onsubmit=e=>{e.preventDefault();STATE.maxTime=+$('#np-max-time').value;STATE.maxCost=+$('#np-max-cost').value;STATE.plan=buildWeeklyPlan();STATE.reviewed=false;rerender();};
 if($('#np-new-recipe'))$('#np-new-recipe').onclick=()=>showRecipeEditor(null);
 const bindCards=()=>{$('[data-open-rec]').forEach(b=>b.onclick=()=>openRecipeModal(+b.dataset.openRec));$('[data-edit-rec]').forEach(b=>b.onclick=()=>showRecipeEditor(+b.dataset.editRec));$('[data-favorite]').forEach(b=>b.onclick=()=>{const id=+b.dataset.favorite;STATE.favorites=STATE.favorites.includes(id)?STATE.favorites.filter(x=>x!==id):[...STATE.favorites,id];saveState();if($('#np-search'))filterRecipes();});};
 function filterRecipes(){const query=$('#np-search').value.toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,''),slot=$('#np-slot').value,time=+$('#np-time').value,sort=$('#np-sort').value;let list=R.filter(r=>{const name=(r.n+' '+Object.keys(r.i).map(k=>I[k]?.[0]||'').join(' ')).toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'');return name.includes(query)&&(slot==='all'||r.s.includes(slot))&&(!time||parseInt(r.time)<=time)&&(sort!=='favorites'||STATE.favorites.includes(r.id))&&(!$('#np-compatible').checked||isRecipeAllowed(r,slot==='all'?r.s[0]:slot));});if(sort==='cheap')list.sort((a,b)=>unitCost(a)-unitCost(b));$('#recipe-cards-container').innerHTML=renderRecipeCardList(list);bindCards();}
 if($('#np-search')){for(const id of ['np-search','np-slot','np-time','np-sort','np-compatible'])$('#'+id)[id==='np-search'?'oninput':'onchange']=filterRecipes;}bindCards();
 if($('#np-export'))$('#np-export').onclick=exportBackup;
 if($('#np-import'))$('#np-import').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>3e6)throw Error('El respaldo supera el tamaño permitido.');const next=validateBackup(JSON.parse(await file.text()));if(!confirm('¿Cargar el respaldo y reemplazar los datos de este navegador?'))return;STATE=structuredClone(next);normalizeState();rerender();showToast('Respaldo cargado');}catch(err){$('#np-import-message').textContent=err.message;}};
 if($('#btn-print-plan'))$('#btn-print-plan').onclick=()=>{document.body.classList.add('np-printing');$('#np-print-content')?.remove();const g=calculateGroceries(STATE.plan);const p=document.createElement('section');p.id='np-print-content';p.innerHTML=`<h1>${esc(STATE.clinician.clinic)}</h1><p>${esc(STATE.clinician.name)} · ${esc(STATE.clinician.specialty)} · Cédula: ${esc(STATE.clinician.license||'Sin registrar')}</p><p>Paciente: ${esc(STATE.patient.name)} · ${new Date().toLocaleDateString('es-MX')} · ${STATE.reviewed?'Revisión registrada '+esc(STATE.reviewedAt):'Borrador pendiente de revisión'}</p><h2>Menú semanal</h2><p>Referencias para 1 porción individual. Compra calculada para ${servings()} porciones familiares por platillo.</p>${originalMenu(STATE.plan,activeSlots())}${indicationContent()}<p>${STATE.targets.kcal?'Energía indicada: '+STATE.targets.kcal+' kcal/día. ':''}${STATE.targets.water?'Líquidos indicados: '+STATE.targets.water+' L/día.':''}</p><h2>Lista de compras · ${money(g.total)} MXN</h2><ul>${g.items.filter(i=>i.buy>0).map(i=>`<li>${esc(i.name)}: ${i.label} — ${money(i.cost)}</li>`).join('')}</ul><p>Presupuesto: ${money(STATE.budget)}. Precios de ejemplo editables; nutrientes estimados. Próxima consulta: ${esc(STATE.followup||'Por acordar')}.</p>`;document.body.appendChild(p);window.print();document.body.classList.remove('np-printing');};
 // Registrar cambios reales del menú para invalidar la marca de revisión.
 $('[data-check-item]').forEach(cb=>{cb.onchange=()=>{STATE.got[cb.dataset.checkItem]=cb.checked;rerender();};});
 if($('#btn-copy-list'))$('#btn-copy-list').onclick=async()=>{const g=calculateGroceries(STATE.plan);const txt='LISTA DE COMPRAS · '+money(g.total)+' MXN\n'+g.items.filter(i=>i.buy>0).map(i=>`- ${i.name}: ${i.label} (${money(i.cost)})`).join('\n');try{await navigator.clipboard.writeText(txt);showToast('Lista copiada');}catch{showTextCopy(txt);}};
 if($('#btn-share-whatsapp'))$('#btn-share-whatsapp').onclick=()=>{const txt='MENÚ SEMANAL\n'+STATE.plan.map((d,i)=>DAYS[i]+'\n'+activeSlots().map(s=>SLOT_NAMES[s]+': '+(R[d[s]]?.n||'Sin receta')).join('\n')).join('\n\n')+'\n\n'+STATE.clinician.notes;showTextCopy(txt);};
};
function showTextCopy(txt){$('#modal-root').innerHTML=`<div class="modal-overlay"><div class="modal-box" role="dialog" aria-modal="true" aria-label="Texto para compartir"><div class="modal-header"><h2 class="modal-title">Copia y comparte tu plan</h2><button class="close-btn" id="np-close-copy" aria-label="Cerrar">×</button></div><p class="np-muted">Revisa el contenido antes de pegarlo en tu aplicación de mensajes.</p><textarea class="form-control" id="np-copy-text" rows="14">${esc(txt)}</textarea></div></div>`;$('#np-close-copy').onclick=()=>$('#modal-root').innerHTML='';$('#np-copy-text').select();}
const originalRender=renderApp;
function menuFingerprint(){return JSON.stringify([STATE.plan,STATE.adults,STATE.kids,STATE.hasKids,STATE.customRecipes,STATE.excl,STATE.diet,STATE.lowcarb]);}
let lastMenuSnapshot=menuFingerprint();
renderApp=function(){
 normalizeState();if(STATE.plan&&lastMenuSnapshot!==menuFingerprint())STATE.reviewed=false;
 originalRender();lastMenuSnapshot=menuFingerprint();
 const app=$('#app');app.dataset.mode=STATE.mode;
 const logo=$('.brand-icon');if(logo)logo.innerHTML='<svg width="27" height="27" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M24 6C12 5 5 10 8 20c10 4 18-2 16-14Z" stroke="currentColor" stroke-width="2"/><path d="M7 26 21 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

 const g=calculateGroceries(STATE.plan),empty=STATE.plan.reduce((n,d)=>n+activeSlots().filter(s=>d[s]==null).length,0);

 const cards=$('.kpi-card');if(cards[1]){cards[1].querySelector('.kpi-label').textContent='Compra evitada · despensa';cards[1].querySelector('.kpi-val').textContent=money(g.saved);cards[1].querySelector('.kpi-sub').textContent='Según las existencias registradas';}
 if(cards[2])cards[2].querySelector('.kpi-sub').textContent=STATE.targets.kcal?'Meta registrada: '+STATE.targets.kcal+' kcal/día':'Sin meta de energía registrada';

 $('[data-tab="clinical"]').forEach(x=>{if(x.classList.contains('tab-btn'))x.innerHTML=STATE.mode==='clinician'?'Consulta e indicaciones':'Mis indicaciones';});

 const badge=$('.patient-badge-banner .info-pills');if(badge)badge.innerHTML=`<span><b>Paciente:</b> ${esc(STATE.patient.name)}</span><span class="pill-badge">${esc(CLINICAL_GOALS[STATE.patient.goal].name)}</span>`;
 if(STATE.mode==='patient'){$('.patient-badge-banner').style.display='none';}
 // Evitar significados visuales erróneos de métricas de calorías y costes.
 $('.kpi-label').forEach(x=>{if(x.children.length>1)x.lastElementChild.textContent='';});
 saveState();

document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal-root').innerHTML='';if(e.key==='Tab'){const modal=$('.modal-box');if(!modal)return;const list=Array.from(modal.querySelectorAll('button,input,select,textarea,[tabindex="0"]')).filter(x=>!x.disabled);if(!list.length)return;const first=list[0],last=list[list.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
